<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Music App</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            integrity="sha512-xxx" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>

    <body>
        <div class="app">
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
            <h1><i class="fas fa-music"></i> My Music App</h1>

            <div class="content-container">
                <div class="player">
                    <img id="cover" src="" alt="Cover Image" />
                    <h2 id="title">Loading...</h2>
                    <audio id="audio" src=""></audio>

                    <div class="controls">
                        <button id="prev" class="control-btn" title="Previous">
                            <i class="fas fa-backward"></i>
                        </button>
                        <button id="play" class="control-btn play-btn" title="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <button id="next" class="control-btn" title="Next">
                            <i class="fas fa-forward"></i>
                        </button>
                    </div>
                    
                    <div class="progress-container">
                        <input type="range" id="progress" value="0" />
                    </div>
                    
                    <div class="volume-control">
                        <i class="fas fa-volume-up"></i>
                        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
                    </div>
                    
                    <div class="options">
                        <button id="repeat" class="option-btn" title="Repeat">
                            <i class="fas fa-repeat"></i>
                        </button>
                        <button id="shuffle" class="option-btn" title="Shuffle">
                            <i class="fas fa-random"></i>
                        </button>
                    </div>

                </div>

                <div class="playlist-container">
                    <h3><i class="fas fa-list"></i> Playlist</h3>
                    <ul id="playlist"></ul>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
